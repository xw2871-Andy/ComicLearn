[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comicteach"
version = "0.2.0"
description = "Turn any educational curriculum (topic, markdown, or textbook PDF) into a comic lesson using AI lesson planning, storyboarding, rendering, and visual QA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy", email = "xw2871@nyu.edu" }]
keywords = ["education", "ai", "claude", "comic", "curriculum", "edtech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.39.0",
    "httpx[socks]>=0.25.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "pdfplumber>=0.11.0",
    "reportlab>=4.1.0",
    "svglib>=1.5.1,<1.6",
    "rich>=13.7.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
curriculum-to-comic = "curriculum_to_comic.cli:main"
c2c = "curriculum_to_comic.cli:main"
c2c-studio = "run_web:main"

[tool.setuptools.packages.find]
include = ["curriculum_to_comic*", "web*"]
